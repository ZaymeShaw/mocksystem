schema_version: "1.0"
profile_id: pi_coding_local_relay
harness: pi_coding
# Isolated cwd: Pi project .mcp.json (ITOOLS_AGENT_ID=pi) + agent.md — not workspaces/claude
project_cwd: ../../../workspaces/pi
bin: pi
agent_md: agent.md
mcp_config: .mcp.json
timeout_sec_per_turn: 300
idle_timeout_sec_per_turn: 600
turn_max_attempts: 2
concurrency: 1
workspace_isolation: none
session_policy:
  new_session_per_case: true
  resume_within_case: true
output:
  eval_runs_dir: ../../../eval_runs
  keep_raw_stream: true
adapter:
  output_format: json
  verbose: true
  append_system_prompt: true
  # Pi local-relay knobs (read by adapters.registry._pi_run_case)
  provider: local-relay
  model: deepseek-v4-flash
  thinking: "off"
  no_builtin_tools: false  # 2026-09-25: full Pi builtin tools (read/grep/...) so truncated MCP output spill files are readable
  approve: true
  extra_args: []
notes: >
  Phase B Pi profile. Uses workspaces/pi/.mcp.json (insurance-tools, ITOOLS_AGENT_ID=pi,
  directTools:true). Auth via LITELLM_MASTER_KEY + PI_EVAL_CASE_ID→X-Eval-Case-Id
  on local-relay. Does not modify Claude workspaces/claude/.mcp.json.
