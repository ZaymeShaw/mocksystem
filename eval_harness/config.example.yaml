# Claude Code eval harness config (example)
harness: claude_code
project_cwd: /Users/YOU/path/to/mock_system
claude_bin: claude   # or absolute path
agent_md: agent.md   # relative to project_cwd
mcp_config: .mcp.json  # optional; cwd usually auto-loads
dataset_path: eval_harness/data/120题-仅问句版(1).md
# gold metadata (not used for prompts / scoring)
gold_dataset_path: eval_harness/data/复杂协同与上下文问题集-120题(2).md
eval_runs_dir: eval_runs
concurrency: 1
timeout_sec_per_turn: 300
permission_mode: bypassPermissions
dangerously_skip_permissions: true
append_system_prompt: true
output_format: stream-json
verbose: true
include_partial_messages: true
# Extra argv appended as-is (list of strings)
extra_args: []
notes: ""
