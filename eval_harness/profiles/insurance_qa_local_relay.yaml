schema_version: "1.0"
profile_id: insurance_qa_local_relay
harness: insurance_qa_agno
# Live batch ends with auto llm_trace.html (same pattern as Claude eval_harness.run).
# Smoke: PYTHONPATH=src python3 -m eval_harness.insurance_qa_adapter --case-id INS_SMOKE_001
# Live:  PYTHONPATH=src python3 -m eval_harness.insurance_qa_adapter --live-batch --cases A01,A02 \
#          --run-id insurance_datasetA_<stamp> --chat-url http://127.0.0.1:18063/v1/chat --user-id 1050900009
relay:
  base_url: http://127.0.0.1:4001/v1
  # api_key from LITELLM_MASTER_KEY / INSURANCE_RELAY_API_KEY
  model: deepseek-v4-flash
injection:
  header: X-Eval-Case-Id
  body_field: eval_case_id
  helper: eval_harness.relay_inject.openai_compatible_kwargs
output:
  eval_runs_dir: /Users/xiaozijian/WorkSpace/package/mock_system/eval_runs
notes: >
  Thin connect profile for insurance-style Agno OpenAIChat through the local
  relay, plus live /v1/chat batch via insurance_qa_adapter --live-batch.
  Live batch writes cases/INS_* under absolute eval_runs_dir, ingests gateway
  llm_calls per case by lane execution_id (live QA does not inject
  X-Eval-Case-Id), and ends with build_llm_trace_html(run_dir) automatically —
  same as Claude eval_harness.run. Does not modify the insurance_qa_agent repo.
