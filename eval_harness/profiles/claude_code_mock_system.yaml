schema_version: "1.0"
profile_id: claude_code_mock_system
harness: claude_code
# Isolated cwd: only MCP/agent/settings — not the eval_harness tree
project_cwd: /Users/xiaozijian/WorkSpace/package/mock_system/mock_run
bin: /Users/xiaozijian/.npm-global/bin/claude
agent_md: agent.md
mcp_config: .mcp.json
permission_mode: bypassPermissions
dangerously_skip_permissions: true
timeout_sec_per_turn: 300
# stdout idle kill (adapter also reads EVAL_IDLE_TIMEOUT_SEC, default 45)
idle_timeout_sec_per_turn: 600
# incomplete/idle/overall failure retries once (EVAL_TURN_MAX_ATTEMPTS, default 2)
turn_max_attempts: 2
concurrency: 1
workspace_isolation: none
session_policy:
  new_session_per_case: true
  resume_within_case: true
output:
  # Keep artifacts outside mock_run so the agent cwd stays clean
  eval_runs_dir: /Users/xiaozijian/WorkSpace/package/mock_system/eval_runs
  keep_raw_stream: true
adapter:
  output_format: stream-json
  verbose: true
  include_partial_messages: true
  append_system_prompt: true
  extra_args: []
notes: "v1 profile. project_cwd=mock_run isolates Claude from eval_harness/eval_runs. Auth in mock_run/.claude; MCP venv via absolute path in .mcp.json."
